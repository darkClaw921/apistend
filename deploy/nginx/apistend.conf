# nginx на боевом сервере: /etc/nginx/sites-available/apistend.
#
# Файл лежит в репозитории, потому что маршрутизация — часть устройства продукта,
# а не настройка машины: перечень префиксов, уходящих на API, повторяет то, что
# регистрирует Fastify, и расходиться они не должны. Копия на сервере ставится
# вручную (`apistend-deploy` её не трогает), поэтому после правки здесь нужно
# скопировать файл, проверить `nginx -t` и перезагрузить nginx.
#
# Устройство: один домен обслуживает всё, поддомены нужны для двух вещей —
# короткая ссылка на документацию и сертификат, покрывающий любое имя,
# которое DNS уже направляет на этот сервер (*.apistend.ru).

# ───────────────── Ответ на время выкатки ──────────────────
#
# При перезапуске Fastify (выкатка занимает несколько секунд) nginx отдавал
# СВОЮ страницу 502 — HTML. Для браузера это терпимо, для клиента API нет:
# он ждёт JSON, получает `<html>` и падает на разборе, а разработчик видит не
# «сервис недоступен, повторите», а ошибку парсера в своём коде.
#
# Поэтому ошибка апстрима перехватывается и отдаётся конвертом того сервиса,
# к которому шёл запрос. Тела скопированы из packages/shared/src/errors.ts —
# те же самые формы, что мок отдаёт в рабочем состоянии; клиент разберёт их
# своим обычным разбором ошибки.
map $uri $unavailable_body {
    # APIStend и его кабинет.
    default    '{"error":{"code":"service_unavailable","message":"APIStend перезапускается, повторите через несколько секунд"}}';
    # Битрикс24: error + error_description.
    ~^/(b24|rest|oauth)/  '{"error":"INTERNAL_SERVER_ERROR","error_description":"APIStend перезапускается, повторите через несколько секунд"}';
    # Ozon: конверт rpcStatus. 14 — UNAVAILABLE в кодах gRPC.
    ~^/oz/     '{"code":14,"message":"APIStend перезапускается, повторите через несколько секунд","details":[]}';
    # Wildberries: title/detail/code/requestId/origin.
    ~^/wb/     '{"title":"service unavailable","detail":"APIStend перезапускается, повторите через несколько секунд","code":"ServiceUnavailable","requestId":"deploy","origin":"apistend"}';
    # Apify: объект error с типом и сообщением.
    ~^/apify/(?!mcp)  '{"error":{"type":"service-unavailable","message":"APIStend is redeploying, retry in a few seconds"}}';
    # MCP — JSON-RPC: клиент разбирает не HTTP-тело, а конверт с полем error.
    ~^/(apify/)?mcp   '{"jsonrpc":"2.0","id":null,"error":{"code":-32603,"message":"APIStend is redeploying, retry in a few seconds"}}';
}

# ─────────────────────────── HTTP ───────────────────────────
#
# По HTTP не отдаётся ничего, кроме проверки владения доменом: и основной домен,
# и любой поддомен уезжают на HTTPS. Отдельный server для acme нужен потому,
# что редирект выполняется раньше, и без исключения certbot не смог бы
# подтвердить домен по http-01 — то есть продлить сертификат.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name apistend.ru www.apistend.ru *.apistend.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────── Основной домен ─────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apistend.ru www.apistend.ru;

    ssl_certificate     /etc/letsencrypt/live/apistend.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apistend.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Год — рекомендованный срок; браузер после первого визита ходит на этот домен
    # только по HTTPS и не даёт кликнуть «продолжить» при подмене сертификата.
    # includeSubDomains относится и к поддоменам, а они все обслуживаются здесь же.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Экспорт журнала запросов и тела моков бывают крупными.
    client_max_body_size 25m;

    access_log /var/log/nginx/apistend.access.log;
    error_log  /var/log/nginx/apistend.error.log;

    # ── Кабинет, мок-шлюз и сервер авторизации ─────────────────────────────
    # Всё это обслуживает один процесс Fastify на 8080. Пути перечислены
    # поимённо: остальное принадлежит Next.js, и подменять его нельзя.

    # /api/ — REST кабинета, Management API (/api/v1/*) и, отдельно, /api/v1/ —
    # библиотека BX24.js по точному адресу.
    location /api/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }

    # Портал Bitrix24 отдаёт приложению голый DOMAIN, и приложение само
    # склеивает <схема>://<DOMAIN>/rest/<метод>. Поэтому именно корень.
    location /rest/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }

    # Сервер авторизации. Варианты со слэшем и без зарегистрированы отдельно —
    # нормализовать путь нельзя.
    location /oauth/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }

    # /v1/ — три вещи сразу: единый мок-префикс, управление туннелем
    # и WebSocket /v1/tunnel/connect. Пинг раз в 20 с, обрыв считается
    # после 40 с простоя, поэтому таймаут чтения заведомо больше.
    location /v1/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Подстановка вместо боевых адресов сервисов.
    location /b24/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }
    location /oz/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }
    location /wb/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }
    # /apify/ — и REST, и MCP-мок на /apify/mcp. Буферизацию выключаем из-за
    # второго: ответ MCP приходит кадром text/event-stream, и накопленный
    # в буфере кадр клиент увидел бы с задержкой, а то и склеенным со следующим.
    location /apify/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
    }

    # Собственный MCP-сервер APIStend. Адрес точный, без слэша: именно его
    # клиент MCP кладёт в свой конфиг, и location /mcp/ его бы не поймал.
    location = /mcp {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
    }

    # Свои моки пользователя.
    location /custom/ {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /health {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Перехват ошибок апстрима для всех путей, уходящих на Fastify. Retry-After
    # называет срок явно: клиенту незачем гадать, ждать ему секунду или минуту.
    location @unavailable {
        # Тип фиксированный: у всех четырёх конвертов он один, а переменную
        # `default_type` разворачивать не умеет — в ответ ушло бы её имя.
        default_type application/json;
        charset utf-8;
        add_header Retry-After 10 always;
        add_header X-APIStend-State "redeploying" always;
        return 503 $unavailable_body;
    }

    # ── Всё остальное — кабинет, лендинг и документация на Next.js ─────────
    location / {
        include /etc/nginx/snippets/apistend-proxy.conf;
        proxy_pass http://127.0.0.1:3100;
    }
}

# ───────────────────── docs.apistend.ru ─────────────────────
#
# Поддомен — это короткая ссылка, а не вторая копия сайта: документация живёт
# по одному адресу /docs, и постоянный редирект сюда честнее зеркала. Зеркало
# развело бы одни и те же страницы по двум адресам — с раздвоенными ссылками
# у читателей и удвоенной выдачей у поисковых систем.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.apistend.ru;

    ssl_certificate     /etc/letsencrypt/live/apistend.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apistend.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 301 https://apistend.ru/docs$request_uri;
    }
}

# ─────────────── Остальные поддомены *.apistend.ru ──────────
#
# DNS направляет на этот сервер любое имя в зоне, и до появления этого блока
# такой запрос обслуживался первым подходящим server — то есть выдавал основной
# сайт по чужому адресу. Теперь неизвестный поддомен отвечает редиректом
# на канонический домен: соединение при этом всё равно защищено, потому что
# сертификат покрывает и его.
#
# default_server здесь и означает «всё, что не совпало по имени выше».
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/apistend.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apistend.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://apistend.ru$request_uri;
}
