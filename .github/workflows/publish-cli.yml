name: Публикация apistend в npm

# Публикуем по тегу вида apistend-v1.5.0 либо вручную.
# Отдельный тег, а не общий v*, потому что в репозитории лежит не только пакет:
# релиз сервиса и релиз CLI — разные события.
on:
  push:
    tags: ['apistend-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Собрать и проверить, но не публиковать
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Нужно для provenance: npm подписывает пакет через OIDC GitHub,
      # и на странице пакета появляется ссылка на конкретный прогон сборки.
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Ставим только сам пакет и его зависимости: apps/api тянет за собой
      # prisma generate, которому нужна база, а публикации CLI она ни к чему.
      - run: pnpm install --frozen-lockfile --filter apistend...

      # Через `pnpm --filter … exec tsc --noEmit` флаг до tsc не доходит: pnpm
      # съедает его сам и печатает справку компилятора. Работаем из каталога пакета.
      - name: Типы
        run: pnpm run typecheck
        working-directory: packages/cli

      - name: Сборка
        run: pnpm run build
        working-directory: packages/cli

      # Тег и version в package.json должны совпадать. Разошлись — публикация
      # молча выложит не ту версию, а тег в истории будет врать.
      - name: Тег совпадает с версией
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#apistend-v}"
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией пакета $PKG_VERSION" >&2
            exit 1
          fi
          echo "Версия $PKG_VERSION"

      # Самая частая причина сломанной публикации — не то, что попало в tarball:
      # пропавший шебанг, забытый dist, лишние исходники.
      - name: Что уедет в npm
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Пакет запускается из tarball
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/packages/cli/apistend-*.tgz
          ./node_modules/.bin/apistend --version
          ./node_modules/.bin/apistend trigger --help | grep -q -- '--rate'
        working-directory: packages/cli

      - name: Публикация
        if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false
        run: npm publish --access public --provenance
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
